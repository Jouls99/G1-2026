<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/prueba2.css">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>💄 Panel de Gestión de Ventas</h1>
    </header>
    <main>
        <div class="container">

            <div class="panel panel-izquierdo">
                <div>
                    <h2>🛒 Productos en la Venta Actual</h2>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre Producto</th>
                                    <th style="text-align: right;">Precio</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-productos">
                                <tr>
                                    <td colspan="3" class="text-empty">
                                        Ningún producto cargado. Usá el panel de la derecha para sumar artículos.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="panel-footer">
                    <div class="total-container">
                        <span class="total-label">TOTAL:</span>
                        <span class="total-monto" id="total-monto">$0.00</span>
                    </div>
                    <div class="acciones-venta">
                        <button type="button" class="btn-registrar" id="btn-registrar">✔ Registrar Venta</button>
                        <button type="button" class="btn-cancelar" id="btn-cancelar">❌ Eliminar / Cancelar</button>
                    </div>
                    <div class="mesage">
                        <i id="mesage"></i>
                    </div>
                </div>
            </div>

            <div class="panel" style="height: fit-content;">
                <h2>📥 Ingreso de Artículos</h2>
                <form id="formulario-producto">
                    <div class="form-group">
                        <label for="nombre">Nombre del Producto</label>
                        <input type="text" id="nombre" list="productos-datalist" placeholder="Buscar o seleccionar..."
                            required autocomplete="off">
                        <datalist id="productos-datalist"></datalist>
                    </div>
                    <div class="form-group">
                        <label for="codigo">Código / N°</label>
                        <input type="text" id="codigo" placeholder="Código de barra" required>
                    </div>
                    <div class="form-group">
                        <label for="cantidad">Cantidad <span id="stock-info"
                                style="font-size: 0.85em; font-weight: bold; color: #ae3c1d; margin-left: 8px;"></span></label>
                        <input type="number" id="cantidad" min="1" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="precio">Precio de Venta</label>
                        <input type="number" id="precio" step="0.01" placeholder="$0.00" required>
                    </div>
                    <button type="submit" class="btn-cargar">+ Cargar a la Tabla</button>
                </form>
                <div class="extra" style="display: flex; gap: 15px; padding: 5px;">

                    <a href="ControlStock.html" class="ver-stock" style="width: 160px; 
                height: auto; 
                padding: 5px; 
                border: 1px #0f0000 solid;
                border-radius: 8px;
                text-align: center;
                color: #0f0000;
                text-decoration: none;
                transition: 1s ease-in-out;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">
                        Ver stock</a>
                    <a href="informe.html" class="gen-informe" style="width: 160px; 
                height: auto; 
                padding: 5px; 
                border: 1px #0f0000 solid;
                border-radius: 8px;
                text-align: center;
                color: #0f0000;
                text-decoration: none;
                transition: 1s ease-in-out;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">
                        Ver informe</a>

                </div>

            </div>

        </div>
    </main>
    <script src="scrits/preuba2.js"></script>
</body>

</html>
