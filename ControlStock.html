<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/panelstock.css">
    <title>Control de Stock</title>
    
</head>
<body>

    <h1>Panel de gestión de control</h1>
    
    <input type="text" id="globalSearch" class="search-box" placeholder="🔍 Buscar producto por nombre o código...">

    <div class="dashboard">
        <div class="sidebar">
            <h3>Categorías</h3>
            <div id="categoriesContainer"></div>
            <hr>
            <label for="newCatName">Nueva categoría</label>
            <input type="text" id="newCatName" placeholder="Ej: Fragancias">
            <button class="btn btn-success" type="button" onclick="addCategory()">+ Agregar</button>
            <button class="btn btn-export" type="button" onclick="exportarJSON()">⬇ Exportar JSON</button>
            <br>
             <a href="prueba2.html" class="ver-stock" 
                style="width: 160px; 
                height: auto; 
                padding: 5px; 
                border: 1px #0f0000 solid;
                border-radius: 8px;
                text-align: center;
                color: #0f0000;
                text-decoration: none;
                transition: 1s ease-in-out;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">
              Volver</a>
        </div>

        <div class="content" id="mainContent">
            <h3>Selecciona una categoría para ver el stock</h3>
        </div>

        <aside class="detail-panel" id="detailPanel">
            <h3>Detalle del producto</h3>
            <p>Haz clic en un producto para ver información y subcategorías aquí.</p>
            <button class="btn-reporte" id="btnReporte">Generar Reporte</button>
        </aside>

        <div>
            <a href="informe.html" class="ver-stock" 
                style="width: 160px; 
                height: auto; 
                padding: 5px; 
                border: 1px #0f0000 solid;
                border-radius: 8px;
                text-align: center;
                color: #0f0000;
                text-decoration: none;
                transition: 1s ease-in-out;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">
              Ver informe</a>
        </div>
       
    </div>

    <script src="scrits/panelGestión.js">
    </script>
</body>
</html>
